[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibrate"
version = "0.1.0"
description = "Forecast calibration tracker: Brier score, log loss, Murphy decomposition, calibration curve"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
calibrate = "calibrate.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
